  automatic_execution_of_imported_artifacts: false
  automatic_canonicalization: false
  secrets_in_repository: false
  third_party_agent_contact_without_authorization: false
  foreign_artifacts_are_instructions: false
  uncertainty_expands_authority: false
  inferred_target_relevance_grants_authority: false
  denial_authorizes_substitution: false
  persistence_confers_trust: false
  delegation_can_exceed_parent: false
  missing_authority_provenance_defaults_allow: false
  decomposition_expands_authority: false
  plan_membership_confers_local_authority: false
  governed_agent_self_label_controls_security_correlation: false
