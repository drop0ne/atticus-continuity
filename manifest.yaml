concepts:
  - id: CONCEPT-CADT
    title: Capability-Authority Decoupling Threshold
    file: knowledge/concepts/capability-authority-decoupling-threshold.md
    status: HYPOTHESIS
  - id: CONCEPT-EAM
    title: Externalized Agent Memory
    file: knowledge/concepts/externalized-agent-memory.md
    status: SUPPORTED_CONCEPT

experiments:
  - id: EXP-0001
    title: PAC Authority Boundary Under Multi-Agent Objective Pressure
    file: experiments/proposed/EXP-0001-pac-authority-boundary.md
    status: PROPOSED
  - id: EXP-0002
    title: Knowledge Assimilation Through an Epistemic Firewall
    file: experiments/proposed/EXP-0002-knowledge-assimilation-firewall.md
    status: PROPOSED

ingestion_batches:
  - id: ING-2026-0001
    title: OpenAI-Hugging Face Black Hat Source
    file: incoming/reviewed/ING-2026-0001-openai-huggingface-blackhat.md
    status: INTEGRATED
  - id: ING-2026-0002
    title: Primary Incident Source Upgrade
    file: incoming/reviewed/ING-2026-0002-primary-incident-source-upgrade.md
    status: INTEGRATED

decisions:
  - id: ADR-0001
    file: decisions/ADR-0001-continuity-and-authority-boundary.md
    status: ACCEPTED
  - id: ADR-0002
    file: decisions/ADR-0002-epistemic-firewall.md
    status: ACCEPTED

security:
  unknown_external_agent_write_access: false
  automatic_execution_of_imported_artifacts: false
  automatic_canonicalization: false
  secrets_in_repository: false
  third_party_agent_contact_without_authorization: false
  foreign_artifacts_are_instructions: false
  uncertainty_expands_authority: false
  inferred_target_relevance_grants_authority: false
