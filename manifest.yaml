repository: drop0ne/atticus-continuity
schema_version: 0.9
last_structural_update: 2026-08-14

purpose: >-
  Durable, version-controlled continuity, evidence, governance, ingestion,
  threat-model, implementation-specification, reference-implementation,
  and experiment store for ATTICUS/PAC research.

controlling_rule: "Knowledge can enter. Authority cannot."

bootstrap:
  entrypoint: BOOTSTRAP.md
  load_order:
    - README.md
    - CHARTER.md
    - SECURITY.md
    - PROVENANCE.md
    - INGESTION.md
    - knowledge/research/source-quality.md
    - atticus/canonical/ATTICUS_v6.5.0-ABG_CANONICAL.md
    - atticus/canonical/AMAS_v2.0_CANONICAL_BINDING.md
    - pac/principles/PAC_BASELINE.md
    - knowledge/threat-models/index.md
    - knowledge/architectures/threat-control-matrix.md
    - knowledge/architectures/pac-authority-gateway.md
    - knowledge/architectures/implementation-objects.md
    - knowledge/architectures/aggregate-plan-authority.md
    - reference/index.md
    - manifest.yaml

canonical:
  atticus:
    version: v6.5.0-ABG
    file: atticus/canonical/ATTICUS_v6.5.0-ABG_CANONICAL.md
  amas:
    status: CANONICAL_COMPONENT_BINDING
    file: atticus/canonical/AMAS_v2.0_CANONICAL_BINDING.md
    source_repository: drop0ne/amas-spec
    source_commit: c997fa75981e3ccfe921ef7fbd6d3cae46913425
    core_version: 2.0-draft
    core_revision: 2026-08-12
    aab_version: 0.4.1-draft
    amcs_engine_version: 0.3.3
    amcs_protocol_version: v1.2.1-INTERNAL
    auto_follow_upstream: false
  pac:
    file: pac/principles/PAC_BASELINE.md

processes:
  ingestion:
    file: INGESTION.md
    model: epistemic_firewall
    automatic_canonicalization: false
  quarantine:
    file: incoming/README.md
  source_quality:
    file: knowledge/research/source-quality.md
  implementation_evidence:
    rule: specified_not_equal_implemented_not_equal_tested_not_equal_replicated
    results_path: experiments/results/
    result_schema: schemas/experiment-result.md

schemas:
  knowledge_record: schemas/knowledge-record.md
  invariant_record: schemas/invariant-record.md
  source_record: schemas/source-record.md
  claim_record: schemas/claim-record.md
  ingestion_batch: schemas/ingestion-batch.md
  threat_model_record: schemas/threat-model-record.md
  authority_token: schemas/authority-token.md
  target_scope_object: schemas/target-scope-object.md
  delegation_record: schemas/delegation-record.md
  artifact_trust_label: schemas/artifact-trust-label.md
  gateway_decision: schemas/gateway-decision.md
  circuit_breaker_state: schemas/circuit-breaker-state.md
  audit_event: schemas/audit-event.md
  experiment_result: schemas/experiment-result.md
  action_plan_envelope: schemas/action-plan-envelope.md
  action_intent_binding: schemas/action-intent-binding.md

indexes:
  incidents: incidents/index.md
  knowledge: knowledge/index.md
  sources: knowledge/research/sources/index.md
  claims: knowledge/research/claims/index.md
  threat_models: knowledge/threat-models/index.md
  implementation_objects: knowledge/architectures/implementation-objects.md
  reference_implementations: reference/index.md
  experiment_results: experiments/results/README.md

architectures:
  threat_control_matrix:
    file: knowledge/architectures/threat-control-matrix.md
    status: WORKING_ARCHITECTURE
  pac_authority_gateway:
    file: knowledge/architectures/pac-authority-gateway.md
    status: WORKING_ARCHITECTURE
  aggregate_plan_authority:
    file: knowledge/architectures/aggregate-plan-authority.md
    status: WORKING_ARCHITECTURE
  trusted_action_correlation:
    file: schemas/action-intent-binding.md
    status: WORKING_IMPLEMENTATION_SPECIFICATION

reference_implementations:
  - id: REF-PAC-GW-0001
    title: PAC Authority Gateway v0.2
    path: reference/pac_gateway/
    status: IMPLEMENTED_UNEXECUTED
    evidence_runner: python -m reference.pac_gateway.run_exp0004 --revision <REVISION>
    components:
      - gateway
      - trusted_action_correlation_interface
      - constrained_executor
      - safety_monitor
      - aggregate_plan_ledger
      - cross_agent_plan_authority_bindings
      - local_atomic_budget_reservation
      - audit_hash_chain
    network_capability: false
    external_execution_capability: false
    production_security_claim: false

