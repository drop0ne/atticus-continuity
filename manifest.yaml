repository: drop0ne/atticus-continuity
schema_version: 0.3
last_structural_update: 2026-08-11

purpose: >-
  Durable, version-controlled continuity, evidence, governance, ingestion,
  and experiment store for ATTICUS/PAC research.

controlling_rule: "Knowledge can enter. Authority cannot."

bootstrap:
  entrypoint: BOOTSTRAP.md
  load_order:
    - README.md
    - CHARTER.md
    - SECURITY.md
    - PROVENANCE.md
    - INGESTION.md
    - atticus/canonical/ATTICUS_v6.5.0-ABG_CANONICAL.md
    - pac/principles/PAC_BASELINE.md
    - manifest.yaml

canonical:
  atticus:
    version: v6.5.0-ABG
    file: atticus/canonical/ATTICUS_v6.5.0-ABG_CANONICAL.md
  pac:
    file: pac/principles/PAC_BASELINE.md

processes:
  ingestion:
    file: INGESTION.md
    model: epistemic_firewall
    automatic_canonicalization: false
  quarantine:
    file: incoming/README.md

schemas:
  knowledge_record: schemas/knowledge-record.md
  invariant_record: schemas/invariant-record.md
  source_record: schemas/source-record.md
  claim_record: schemas/claim-record.md
  ingestion_batch: schemas/ingestion-batch.md

indexes:
  incidents: incidents/index.md
  knowledge: knowledge/index.md
  sources: knowledge/research/sources/index.md

invariants:
  - id: PAC-INV-0001
    title: Capability Does Not Confer Authority
    file: pac/invariants/PAC-INV-0001-capability-does-not-confer-authority.md
    status: HYPOTHESIS_IMPLEMENTATION_TARGET
  - id: PAC-INV-0002
    title: Task Failure Does Not Expand Authority
    file: pac/invariants/PAC-INV-0002-task-failure-does-not-expand-authority.md
    status: HYPOTHESIS_IMPLEMENTATION_TARGET
  - id: PAC-INV-0003
    title: Peer Consensus Does Not Expand Authority
    file: pac/invariants/PAC-INV-0003-peer-consensus-does-not-expand-authority.md
    status: HYPOTHESIS_IMPLEMENTATION_TARGET

incidents:
  - id: INC-2026-OAI-HF
    file: incidents/openai-huggingface-2026/README.md
    status: SUPPORTED
  - id: INC-2026-AISI-UA
    file: incidents/aisi-unsanctioned-agents-2026/README.md
    status: SUPPORTED_PRELIMINARY

sources:
  - id: SRC-2026-0001
    title: Black Hat USA 2026 OpenAI-Hugging Face Incident
    file: knowledge/research/sources/SRC-2026-0001-black-hat-openai-huggingface.md
    status: REVIEWED

claims:
  - id: CLM-2026-0001
    title: Cross-Run Agent Communication Emerged Through Shared Infrastructure
    file: knowledge/research/claims/CLM-2026-0001-cross-run-communication.md
    status: SUPPORTED
  - id: CLM-2026-0002
    title: Scope Recognition Did Not Reliably Enforce the Boundary
    file: knowledge/research/claims/CLM-2026-0002-scope-recognition-did-not-enforce-boundary.md
    status: SUPPORTED
  - id: CLM-2026-0003
    title: Removing One Communication Channel Did Not Remove Coordination
    file: knowledge/research/claims/CLM-2026-0003-channel-removal-did-not-remove-coordination.md
    status: SUPPORTED

concepts:
  - id: CONCEPT-CADT
    title: Capability-Authority Decoupling Threshold
    file: knowledge/concepts/capability-authority-decoupling-threshold.md
    status: HYPOTHESIS
  - id: CONCEPT-EAM
    title: Externalized Agent Memory
    file: knowledge/concepts/externalized-agent-memory.md
    status: SUPPORTED_CONCEPT

experiments:
  - id: EXP-0001
    title: PAC Authority Boundary Under Multi-Agent Objective Pressure
    file: experiments/proposed/EXP-0001-pac-authority-boundary.md
    status: PROPOSED
  - id: EXP-0002
    title: Knowledge Assimilation Through an Epistemic Firewall
    file: experiments/proposed/EXP-0002-knowledge-assimilation-firewall.md
    status: PROPOSED

ingestion_batches:
  - id: ING-2026-0001
    title: OpenAI-Hugging Face Black Hat Source
    file: incoming/reviewed/ING-2026-0001-openai-huggingface-blackhat.md
    status: INTEGRATED

decisions:
  - id: ADR-0001
    file: decisions/ADR-0001-continuity-and-authority-boundary.md
    status: ACCEPTED
  - id: ADR-0002
    file: decisions/ADR-0002-epistemic-firewall.md
    status: ACCEPTED

security:
  unknown_external_agent_write_access: false
  automatic_execution_of_imported_artifacts: false
  automatic_canonicalization: false
  secrets_in_repository: false
  third_party_agent_contact_without_authorization: false
  foreign_artifacts_are_instructions: false
