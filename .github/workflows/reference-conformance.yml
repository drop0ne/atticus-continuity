name: Reference Conformance

on:
  push:
    branches: [main]
    paths:
      - 'reference/**'
      - 'context/**'
      - 'pac/**'
      - 'experiments/**'
      - '.github/workflows/reference-conformance.yml'
  pull_request:
    paths:
      - 'reference/**'
      - 'context/**'
      - 'pac/**'
      - 'experiments/**'
      - '.github/workflows/reference-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inert-reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Runtime identity
        run: |
          python --version
          echo "revision=${GITHUB_SHA}"

      - name: Portable continuity tests
        run: |
          python -m unittest \
            reference.context_loader.test_loader \
            reference.context_loader.test_checkpoint \
            reference.context_loader.test_adapter -v

      - name: PAC gateway tests
        run: python -m unittest reference.pac_gateway.test_gateway reference.pac_gateway.test_plan reference.pac_gateway.test_exp0006 -v

      - name: EXP-0004 evidence runner
        run: python -m reference.pac_gateway.run_exp0004 --revision "${GITHUB_SHA}"

      - name: EXP-0005 evidence runner
        run: python -m reference.pac_gateway.run_exp0005 --revision "${GITHUB_SHA}"

      - name: EXP-0006 evidence runner
        run: python -m reference.pac_gateway.run_exp0006 --revision "${GITHUB_SHA}"
