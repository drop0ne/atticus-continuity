hydration_rules:
  start_with_core: true
  minimum_sufficient_context: true
  maximum_initial_task_bundles: 3
  deep_source_on_demand: true
  historical_lineage_on_demand: true
  repository_is_authoritative_for_project_state: true
  host_system_constraints_still_apply: true
  platform_memory_is_optional_cache: true
  missing_required_record_behavior: REPORT_AND_DEGRADE
  dependency_cycle_behavior: STOP_AND_REPORT
  external_component_bindings_require_immutable_pins: true
  bundle_match_confers_authority: false

provider_conformance:
  scenario_ids:
    - CPBC-01
    - CPBC-02
    - CPBC-03
    - CPBC-04
    - CPBC-05
    - CPBC-06
    - CPBC-07
    - CPBC-08
    - CPBC-09
    - CPBC-10
    - CPBC-11
    - CPBC-12
  pass_requires_all_required_scenarios: true
  blocked_counts_as_pass: false
  not_run_counts_as_pass: false
  exact_revision_scope: true
